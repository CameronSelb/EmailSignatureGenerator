
<!doctype html>
<html >
<head>
    <meta charset="UTF-8">
</head>
<body >
<div width="450" style="width: 450px">
    <table width="450" border="0" cellspacing="0" cellpadding="0">
        <tbody>
        <tr>
            <td width="300" style="width: 300px">
                <table width="300" style="width: 285px">
                    <tbody>
                    <tr style="padding-top:0; padding-bottom: 0;">
                        <td class="name" colspan="3" style="padding-top:0; padding-bottom: 0; line-height: 0.75; font-family: outfit-thin, Gotham, &quot;Helvetica Neue&quot;, Helvetica, Arial, &quot;sans-serif&quot;;font-size: 24px;font-weight: 700;font-kerning: none;color: #303034;">{{first_name}}</td>
                    </tr>
                    <tr style="padding-top:0; padding-bottom: 0;">
                        <td class="surname" colspan="3" style="padding-top:0; padding-bottom: 0; width: 100%; font-family: outfit-thin, Gotham, &quot;Helvetica Neue&quot;, Helvetica, Arial, &quot;sans-serif&quot;;font-size: 24px;font-weight: 700;font-kerning: none;color: #303034;">{{last_name}}</td>
                    </tr>
                    <tr>
                        <td height="28" colspan="3" class="designation" style="font-family: outfit-thin, Gotham, &quot;Helvetica Neue&quot;, Helvetica, Arial, &quot;sans-serif&quot;;font-size: 18px;font-weight: 600;color: #303034;">
                            {{job_title}}
                        </td>
                    </tr>
                    <tr>
                        <td colspan="3">
                            <table width="100%" style="width: 100%">
                                <tbody>
                                <tr>
                                    <td width="50%" colspan="" height="16"  style="padding-top: 0; padding-bottom: 0;font-family: outfit-thin, Gotham, &quot;Helvetica Neue&quot;, Helvetica, Arial, &quot;sans-serif&quot;;font-size: 8px;font-weight: 600;color: #303034;">
                                                                                <a target="_blank" href="tel:{{phone_number}}" style="color: #303034;text-decoration: none; line-height: 0.5">{{phone_number}}</a>
                                        &nbsp;
                                        /&nbsp;
                                        <a target="_blank" href="mailto:{{email}}" style="color: #303034;text-decoration: none; line-height: 0.5 ">{{email_view}}</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
