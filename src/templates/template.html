<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
</head>

<body>
    <table width="400" border="0" cellspacing="0" cellpadding="0"
        style="width: 400px; font-family: Arial, Helvetica, sans-serif;">
        <tbody>
            <tr>
                <td width="250" style="width: 250px; padding-right: 20px; border-right: 2px solid {{colour}};">

                    <div style="font-size: 24px; font-weight: 700; color: #303034;">
                        {{first_name}} {{last_name}}
                    </div>

                    <div style="font-size: 18px; font-weight: 700; color: {{colour}}; margin-top: 5px;">
                        {{job_title}}
                    </div>

                </td>

                <td width="250" style="width: 250px; padding-left: 20px;">

                    <div style="font-size: 13px; margin-bottom: 6px;">
                        <a
                            href="tel:{{phone_number}}"
                            target="_blank"
                            style="color: #303034; text-decoration: none;"
                        >
                            {{phone_number}}
                        </a>
                    </div>

                    <div style="font-size: 13px; margin-bottom: 6px;">
                        <a
                            href="mailto:{{email}}"
                            target="_blank"
                            style="color: #303034; text-decoration: none;"
                        >
                            {{email_view}}
                        </a>
                    </div>

                    <div style="font-size: 13px;">
                        <a
                            href="{{website}}"
                            target="_blank"
                            style="color: {{colour}}; text-decoration: none;"
                        >
                            {{website}}
                        </a>
                    </div>

                </td>

            </tr>
        </tbody>
    </table>
</body>
</html>
